<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen Garden | Raymond Doan</title>
<meta name="description" content="A small pixel zen garden. Rake the sand, place stones, pines and lanterns, and watch the day turn to night.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&family=Press+Start+2P&display=swap">
<style>
:root {
  color-scheme: light;
  --cream: #f6f1ea;
  --sand: #efe6d8;
  --ink: #241208;
  --muted: #6b5847;
  --rust: #b7410e;
  --terra: #c06c47;
  --teal: #28616c;
  --on-accent: #fffaf6;
  --pixel: 'Press Start 2P', 'Courier New', monospace;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--cream);
  color: var(--ink);
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.page {
  max-width: 1040px;
  margin: 0 auto;
  padding: 14px 10px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.bar {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
  flex-wrap: wrap;
}
h1 {
  font: 400 clamp(13px, 3.4vw, 22px)/1.4 var(--pixel);
  margin: 0;
  flex: 1 1 auto;
  text-align: center;
  letter-spacing: 0.02em;
}
.pbtn {
  font: 400 10px/1 var(--pixel);
  color: var(--ink);
  background: var(--sand);
  border: 3px solid var(--ink);
  border-radius: 0;
  padding: 13px 12px;
  min-height: 44px;
  box-shadow: 0 4px 0 var(--ink);
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.pbtn:hover { background: #fffaf2; }
.pbtn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
.pbtn[aria-pressed="true"] { background: var(--rust); color: var(--on-accent); }
.pbtn:focus-visible, canvas:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; }
.cabinet {
  background: var(--ink);
  padding: clamp(4px, 1.2vw, 10px);
  box-shadow: 6px 6px 0 var(--terra);
  line-height: 0;
  max-width: 100%;
}
canvas {
  display: block;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  touch-action: none;
  cursor: crosshair;
  user-select: none;
  -webkit-user-select: none;
}
.tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 8px; padding-bottom: 4px; }
.tools .gap { width: 10px; }
.hint {
  font: 500 14px/1.5 'IBM Plex Mono', 'Courier New', monospace;
  color: var(--muted);
  text-align: center;
  margin: 0;
  min-height: 3em;
  max-width: 60ch;
}
.foot { font-size: 14px; color: var(--muted); text-align: center; margin: 0; }
.foot a { color: var(--rust); }
noscript p { text-align: center; color: var(--muted); }
@media (max-width: 420px) {
  .pbtn { padding: 12px 9px; font-size: 9px; }
  .tools .gap { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .pbtn:active { transform: none; }
}
</style>
</head>
<body>
<div class="page">
  <header class="bar">
    <a class="pbtn" href="arcade.html">&larr; Arcade</a>
    <h1>ZEN GARDEN</h1>
    <button class="pbtn" id="sound" type="button" aria-pressed="false">Sound: off</button>
  </header>

  <div class="cabinet">
    <canvas id="garden" width="160" height="104" tabindex="0" role="application" aria-label="Zen garden. Drag to rake the sand. With a keyboard, use the arrow keys to move and the space bar to rake or place."></canvas>
  </div>

  <div class="tools" role="toolbar" aria-label="Garden tools">
    <button class="pbtn" type="button" data-tool="rake" aria-pressed="true">Rake</button>
    <button class="pbtn" type="button" data-tool="stone" aria-pressed="false">Stone</button>
    <button class="pbtn" type="button" data-tool="pine" aria-pressed="false">Pine</button>
    <button class="pbtn" type="button" data-tool="lantern" aria-pressed="false">Lantern</button>
    <button class="pbtn" type="button" data-tool="erase" aria-pressed="false">Erase</button>
    <span class="gap" aria-hidden="true"></span>
    <button class="pbtn" type="button" id="tines">Tines: 5</button>
    <button class="pbtn" type="button" id="time">Time: Auto</button>
    <button class="pbtn" type="button" id="smooth">Smooth sand</button>
    <button class="pbtn" type="button" id="clear">Clear all</button>
  </div>

  <p class="hint" id="hint" aria-live="polite">Drag across the sand to rake it.</p>
  <p class="foot">A small game by <a href="index.html">Raymond Doan</a>. More in the <a href="arcade.html">Arcade</a>.</p>
  <noscript><p>This game needs JavaScript. Turn it on and reload the page.</p></noscript>
</div>

<script>
(function () {
  'use strict';

  /* ---------- sizes ---------- */
  var W = 160, H = 104;                         /* the picture, in game pixels */
  var FX0 = 6, FX1 = 153, FY0 = 36, FY1 = 97;   /* the sand field, inclusive */
  var FW = FX1 - FX0 + 1, FH = FY1 - FY0 + 1;
  var MAX_OBJECTS = 40;
  var CYCLE_SECONDS = 240;
  var STORE_KEY = 'rd-zen-garden-v1';

  var canvas = document.getElementById('garden');
  var ctx = canvas.getContext('2d');
  if (!ctx) return;
  var image = ctx.createImageData(W, H);
  var buf = image.data;
  var lit = new Uint8Array(W * H);
  var reduceMotion = false;
  try { reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) {}

  /* ---------- small helpers ---------- */
  function hex(c) { return [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)]; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smooth(t) { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); }
  function mix(a, b, t) { return [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)]; }
  function scale3(c, k) { return [c[0] * k, c[1] * k, c[2] * k]; }
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function hash2(x, y) {
    var h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return (h ^ (h >>> 16)) >>> 0;
  }

  function put(x, y, c, l) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var i = y * W + x, j = i * 4;
    buf[j] = c[0]; buf[j + 1] = c[1]; buf[j + 2] = c[2];
    lit[i] = l ? 1 : 0;
  }
  function blendPx(x, y, c, a) {
    x = Math.round(x); y = Math.round(y);
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    var j = (y * W + x) * 4;
    buf[j] = buf[j] * (1 - a) + c[0] * a;
    buf[j + 1] = buf[j + 1] * (1 - a) + c[1] * a;
    buf[j + 2] = buf[j + 2] * (1 - a) + c[2] * a;
  }
  function rect(x, y, w, h, c, l) {
    for (var yy = 0; yy < h; yy++) for (var xx = 0; xx < w; xx++) put(x + xx, y + yy, c, l);
  }
  for (var ai = 3; ai < buf.length; ai += 4) buf[ai] = 255;

  /* ---------- colours ---------- */
  var C = {
    sand: hex('#e8dcc6'), speckD: hex('#dccfb6'), speckL: hex('#f0e6d2'),
    groove: hex('#c4b28f'), ridge: hex('#f6efe0'),
    grass: hex('#5f8f72'), grassL: hex('#74a889'), grassD: hex('#4f7d63'),
    earth: hex('#5b4b3d'), earthD: hex('#4a3d32'),
    hedge: hex('#2f6b57'), hedgeL: hex('#3f8a6f'), hedgeD: hex('#255645'),
    hillFar: hex('#9db9a8'), hillNear: hex('#7aa08d'),
    moss: hex('#5f9a7a'), mossL: hex('#7fbb9e'), mossD: hex('#4a7f63'),
    shadow: hex('#281c10'), warm: hex('#ffbe6e'), flame: hex('#ffd678'),
    firefly: hex('#d2ffa0'), cream: hex('#f6f1ea')
  };
  var SPRITE_PAL = {
    o: '#3b2e24', m: '#7d6e5e', l: '#a99a87', h: '#c9bba8', d: '#5b4b3d',
    g: '#2f6b57', G: '#3f8a6f', n: '#7fbb9e', t: '#6b4a30', u: '#4d3624',
    k: '#4a3d32', R: '#b8aa98', w: '#8a6a40', c: '#ffffff', C: '#dcd6cf'
  };
  var PAL = {};
  Object.keys(SPRITE_PAL).forEach(function (k) { PAL[k] = hex(SPRITE_PAL[k]); });

  /* ---------- sprites: one string per row, '.' is empty ---------- */
  var STONES = [
    ['...ooooo...', '..ohhhllo..', '.ohhllllmo.', 'ohhllllmmmo', 'ollllmmmmdo', 'ommmmmmdddo', '.oodddddoo.'],
    ['..ooo..', '.ohhlo.', 'ohllmmo', 'ommmddo', '.ooooo.'],
    ['...oooo..', '..ohhllo.', '..ohlllmo', '.ohhllmmo', '.ohlllmmo', 'ohhllmmdo', 'ohllmmmdo', 'ommmmmddo', '.ooddddo.']
  ];
  var PINE = [
    '.......g.......', '......gGg......', '.....gGnGg.....', '....gGnGGGg....', '...gGGnGGGGg...',
    '....gggggggg...', '......gGg......', '.....gGnGg.....', '....gGnGGGg....', '...gGGnGGGGg...',
    '..gGGGGnGGGGGg.', '...gggggggggg..', '.......tu......', '.......tu......', '......ttuu.....'
  ];
  var LANTERN = [
    '....k....', '...kRk...', '.kRRRRRk.', 'kkkkkkkkk', '..kwwwk..', '..kwwwk..',
    '..kkkkk..', '...kRk...', '...kRk...', '..kRRRk..', '.kRRRRRk.', 'kkkkkkkkk'
  ];
  var CLOUDS = [
    ['....cccc....', '..cccccccc..', '.cccccccccc.', 'cccccccccccc', 'CCCCCCCCCCCC'],
    ['...cccc...', '.cccccccc.', 'cccccccccc', 'CCCCCCCCCC']
  ];

  function checkSprites() {
    var all = STONES.concat([PINE, LANTERN], CLOUDS);
    all.forEach(function (s) {
      s.forEach(function (row) { if (row.length !== s[0].length) throw new Error('sprite rows differ in width'); });
    });
  }
  checkSprites();

  function blit(spr, ax, ay, alpha, lightIt) {
    var w = spr[0].length, h = spr.length;
    var ox = ax - Math.floor(w / 2), oy = ay - (h - 1);
    for (var r = 0; r < h; r++) {
      for (var c = 0; c < w; c++) {
        var ch = spr[r].charAt(c);
        if (ch === '.') continue;
        var col = PAL[ch];
        if (!col) continue;
        if (alpha !== undefined && alpha < 1) blendPx(ox + c, oy + r, col, alpha);
        else put(ox + c, oy + r, col, lightIt !== false);
      }
    }
  }

  /* ---------- time of day ---------- */
  var DAWN = { top: [112, 100, 150], bot: [244, 166, 110], tint: [1.0, 0.82, 0.70], dark: 0.35, stars: 0.15, cloud: [250, 200, 170] };
  var DAY = { top: [128, 190, 214], bot: [250, 236, 208], tint: [1, 1, 1], dark: 0, stars: 0, cloud: [250, 247, 240] };
  var NIGHT = { top: [10, 28, 34], bot: [38, 74, 92], tint: [0.42, 0.52, 0.78], dark: 1, stars: 1, cloud: [58, 88, 110] };
  var KEYS = [
    { t: 0.00, p: DAWN }, { t: 0.14, p: DAY }, { t: 0.38, p: DAY }, { t: 0.50, p: DAWN },
    { t: 0.62, p: NIGHT }, { t: 0.88, p: NIGHT }, { t: 1.00, p: DAWN }
  ];
  function keyAt(t) {
    t = t - Math.floor(t);
    for (var i = 0; i < KEYS.length - 1; i++) {
      var a = KEYS[i], b = KEYS[i + 1];
      if (t >= a.t && t <= b.t) {
        var s = smooth((t - a.t) / (b.t - a.t));
        return {
          top: mix(a.p.top, b.p.top, s), bot: mix(a.p.bot, b.p.bot, s), tint: mix(a.p.tint, b.p.tint, s),
          dark: lerp(a.p.dark, b.p.dark, s), stars: lerp(a.p.stars, b.p.stars, s), cloud: mix(a.p.cloud, b.p.cloud, s)
        };
      }
    }
    return DAY;
  }

  var TIME_MODES = [['auto', 'Auto', null], ['day', 'Day', 0.25], ['dusk', 'Dusk', 0.5], ['night', 'Night', 0.75]];
  var timeMode = 0;
  var now0 = new Date();
  var clockT = (((now0.getHours() + now0.getMinutes() / 60) - 6 + 24) % 24) / 24;
  var simSeconds = 0;
  function currentT() {
    var fixed = TIME_MODES[timeMode][2];
    if (fixed !== null) return fixed;
    return clockT + (reduceMotion ? 0 : simSeconds / CYCLE_SECONDS);
  }

  /* ---------- the sand ---------- */
  var sand = new Uint8Array(FW * FH);     /* 0 flat, 1 groove, 2 ridge */
  var tex = new Uint8Array(FW * FH);
  (function () {
    for (var y = 0; y < FH; y++) for (var x = 0; x < FW; x++) {
      var h = hash2(x + 17, y + 91) & 63;
      tex[y * FW + x] = h < 3 ? 1 : h < 5 ? 2 : 0;
    }
  })();
  function inField(x, y) { return x >= FX0 && x <= FX1 && y >= FY0 && y <= FY1; }
  function setSand(x, y, v) {
    x = Math.round(x); y = Math.round(y);
    if (!inField(x, y)) return;
    sand[(y - FY0) * FW + (x - FX0)] = v;
  }
  function getSand(x, y) { return inField(x, y) ? sand[(y - FY0) * FW + (x - FX0)] : 0; }
  function clearEllipse(cx, cy, rx, ry) {
    for (var y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
      for (var x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
        var dx = (x - cx) / rx, dy = (y - cy) / ry;
        if (dx * dx + dy * dy <= 1) setSand(x, y, 0);
      }
    }
  }
  function ring(cx, cy, rx, ry) {
    var steps = Math.ceil(2 * Math.PI * Math.max(rx, ry) * 1.6);
    var i, a;
    for (i = 0; i < steps; i++) {
      a = (i / steps) * Math.PI * 2;
      setSand(cx + Math.cos(a) * rx, cy + Math.sin(a) * ry, 1);
    }
    for (i = 0; i < steps; i++) {
      a = (i / steps) * Math.PI * 2;
      var qx = Math.round(cx + Math.cos(a) * (rx + 1.2)), qy = Math.round(cy + Math.sin(a) * (ry + 1.2));
      if (getSand(qx, qy) === 0) setSand(qx, qy, 2);
    }
  }

  var tineCount = 5;
  var TINE_GAP = 3;
  /* Smooths a band as wide as the rake, across the direction of travel. */
  function clearBand(qx, qy, dx, dy) {
    var nx = -dy, ny = dx;
    var half = (tineCount - 1) / 2 * TINE_GAP;
    for (var u = -half - 1; u <= half + 2.01; u += 0.5) setSand(qx + nx * u, qy + ny * u, 0);
  }
  /* One stamp of the rake head at q, moving in direction (dx, dy). The band just ahead of the head is
     smoothed first, so the rake wipes what lies in its way but never the grooves it has just cut. Then
     every tine cuts a groove with a ridge beside it. */
  function stampRake(qx, qy, dx, dy) {
    var nx = -dy, ny = dx;
    clearBand(qx + dx * 1.6, qy + dy * 1.6, dx, dy);
    for (var k = 0; k < tineCount; k++) {
      var off = (k - (tineCount - 1) / 2) * TINE_GAP;
      setSand(qx + nx * off, qy + ny * off, 1);
    }
    for (var k2 = 0; k2 < tineCount; k2++) {
      var off2 = (k2 - (tineCount - 1) / 2) * TINE_GAP + 1;
      var rx = Math.round(qx + nx * off2), ry = Math.round(qy + ny * off2);
      if (getSand(rx, ry) === 0) setSand(rx, ry, 2);
    }
  }

  /* ---------- objects ---------- */
  var objs = [];
  var KIND = { stone: 's', pine: 'p', lantern: 'l' };
  var KIND_BACK = { s: 'stone', p: 'pine', l: 'lantern' };
  var STONE_HALF = [5, 3, 4];
  function halfWidth(o) { return o.t === 'stone' ? STONE_HALF[o.v] : o.t === 'pine' ? 7 : 4; }
  function heightOf(o) { return o.t === 'stone' ? STONES[o.v].length : o.t === 'pine' ? PINE.length : LANTERN.length; }
  var stoneCycle = 0;

  function addObject(kind, x, y, v) {
    var o = { t: kind, x: Math.round(x), y: Math.round(y), v: v || 0 };
    var hw = halfWidth(o);
    o.x = clamp(o.x, FX0 + hw + 1, FX1 - hw - 1);
    o.y = clamp(o.y, FY0 + 3, FY1 - 1);
    if (objs.length >= MAX_OBJECTS) objs.shift();
    objs.push(o);
    if (kind === 'stone') {
      ring(o.x, o.y - 1, hw + 4, Math.max(2, Math.round((hw + 4) * 0.45)));
      ring(o.x, o.y - 1, hw + 8, Math.max(3, Math.round((hw + 8) * 0.45)));
    } else if (kind === 'pine') {
      ring(o.x, o.y - 1, 12, 5);
    }
    return o;
  }
  function removeAt(x, y) {
    var removed = false;
    for (var i = objs.length - 1; i >= 0; i--) {
      var o = objs[i], hw = halfWidth(o) + 2, h = heightOf(o) + 2;
      if (x >= o.x - hw && x <= o.x + hw && y <= o.y + 2 && y >= o.y - h) {
        if (o.t !== 'lantern') clearEllipse(o.x, o.y - 1, hw + 10, (hw + 10) * 0.5 + 1);
        objs.splice(i, 1);
        removed = true;
      }
    }
    return removed;
  }

  /* ---------- saving ---------- */
  var saveTimer = 0;
  function pack() {
    var bytes = new Uint8Array(Math.ceil(sand.length / 4));
    for (var i = 0; i < sand.length; i++) bytes[i >> 2] |= (sand[i] & 3) << ((i & 3) * 2);
    var s = '';
    for (var j = 0; j < bytes.length; j++) s += String.fromCharCode(bytes[j]);
    return btoa(s);
  }
  function unpack(str) {
    var bin = atob(str);
    if (bin.length !== Math.ceil(sand.length / 4)) return false;
    for (var i = 0; i < sand.length; i++) sand[i] = Math.min(2, (bin.charCodeAt(i >> 2) >> ((i & 3) * 2)) & 3);
    return true;
  }
  function save() {
    try {
      var data = { v: 1, s: pack(), o: objs.map(function (o) { return [KIND[o.t], o.x, o.y, o.v]; }) };
      localStorage.setItem(STORE_KEY, JSON.stringify(data));
    } catch (e) {}
  }
  function dirty() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 700);
  }
  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return false;
      var d = JSON.parse(raw);
      if (!d || d.v !== 1 || typeof d.s !== 'string' || !Array.isArray(d.o)) return false;
      if (!unpack(d.s)) return false;
      objs = [];
      d.o.slice(0, MAX_OBJECTS).forEach(function (r) {
        if (!Array.isArray(r) || !KIND_BACK[r[0]]) return;
        var x = +r[1], y = +r[2], v = +r[3] || 0;
        if (!isFinite(x) || !isFinite(y)) return;
        var kind = KIND_BACK[r[0]];
        if (kind === 'stone') v = clamp(Math.round(v), 0, STONES.length - 1);
        objs.push({ t: kind, x: clamp(Math.round(x), FX0, FX1), y: clamp(Math.round(y), FY0, FY1), v: v });
      });
      return true;
    } catch (e) { return false; }
  }
  window.addEventListener('pagehide', function () { if (saveTimer) { clearTimeout(saveTimer); save(); } });

  /* A garden to start from, so the first visit is not an empty box. */
  function starterGarden() {
    var i, k;
    for (k = 0; k < 3; k++) {
      var y0 = FY0 + 12 + k * 18;
      for (i = 0; i <= 78; i += 0.5) {
        var x = FX0 + 4 + i;
        var yy = y0 + Math.sin(i / 7 + k * 0.9) * 2.6;
        var slope = Math.cos(i / 7 + k * 0.9) * 2.6 / 7;
        var len = Math.sqrt(1 + slope * slope);
        stampRake(x, yy, 1 / len, slope / len);
      }
    }
    addObject('stone', 118, 62, 0);
    addObject('stone', 131, 70, 1);
    addObject('stone', 105, 74, 2);
    addObject('pine', 138, 52, 0);
    addObject('lantern', 92, 54, 0);
  }

  /* ---------- scenery ---------- */
  var starRand = rng(7);
  var stars = [];
  (function () { for (var i = 0; i < 34; i++) stars.push({ x: Math.floor(starRand() * W), y: Math.floor(starRand() * 17), p: starRand() * 6.28, big: starRand() < 0.2 }); })();
  var clouds = [{ s: 0, x: 20, y: 4, v: 0.7 }, { s: 1, x: 95, y: 9, v: 0.45 }, { s: 0, x: 140, y: 14, v: 0.9 }];
  var flies = [];
  (function () {
    var r = rng(11);

  function hillY(x, far) {
    return far ? 16 + 3 * Math.sin(x / 13) + 2 * Math.sin(x / 5 + 1) : 20 + 2 * Math.sin(x / 9 + 2) + 1.5 * Math.sin(x / 4);
  }

  function paintSky(key, t, ms) {
    var y, x;
    var bands = 6;
    for (y = 0; y < 34; y++) {
      var b = Math.min(bands - 1, Math.floor(y / 4.2));
      var col = mix(key.top, key.bot, b / (bands - 1));
      for (x = 0; x < W; x++) put(x, y, col, false);
    }
    var i;
    if (key.stars > 0.02) {
      for (i = 0; i < stars.length; i++) {
        var s = stars[i];
        var tw = reduceMotion ? 0.8 : 0.6 + 0.4 * Math.sin(ms * 0.002 + s.p);
        var a = key.stars * tw;
        blendPx(s.x, s.y, C.cream, a);
        if (s.big) {
          blendPx(s.x - 1, s.y, C.cream, a * 0.45); blendPx(s.x + 1, s.y, C.cream, a * 0.45);
          blendPx(s.x, s.y - 1, C.cream, a * 0.45); blendPx(s.x, s.y + 1, C.cream, a * 0.45);
        }
      }
    }
    var u = t - Math.floor(t);
    var sp = (u + 0.02) / 0.54;
    var dx, dy;
    if (sp >= 0 && sp <= 1) {
      var sx = lerp(-4, W + 4, sp), sy = 27 - 24 * Math.sin(Math.PI * sp);
      var low = Math.pow(1 - Math.sin(Math.PI * sp), 2);
      var sc = mix([255, 243, 190], [255, 160, 80], clamp(low, 0, 1));
      for (dy = -5; dy <= 5; dy++) for (dx = -5; dx <= 5; dx++) {
        var d2 = dx * dx + dy * dy;
        if (d2 <= 10) put(sx + dx, sy + dy, sc, false);
        else if (d2 <= 26) blendPx(sx + dx, sy + dy, sc, 0.22);
      }
    }
    var uu = u < 0.48 ? u + 1 : u;
    var mp = (uu - 0.48) / 0.54;
    if (mp >= 0 && mp <= 1) {
      var mx = lerp(-4, W + 4, mp), my = 27 - 24 * Math.sin(Math.PI * mp);
      for (dy = -4; dy <= 4; dy++) for (dx = -4; dx <= 4; dx++) {
        var m2 = dx * dx + dy * dy;
        if (m2 <= 10) {
          var sh = (dx - 2) * (dx - 2) + (dy + 1) * (dy + 1);
          if (sh > 7) put(mx + dx, my + dy, [246, 241, 234], false);

    for (i = 0; i < clouds.length; i++) {
      var cl = clouds[i];
      var spr = CLOUDS[cl.s];
      var w = spr[0].length;
      var cx = ((cl.x + (reduceMotion ? 0 : ms * 0.001 * cl.v)) % (W + 40)) - 20;
      for (var r = 0; r < spr.length; r++) for (var c = 0; c < w; c++) {
        var ch = spr[r].charAt(c);
        if (ch === '.') continue;
        var cc = ch === 'C' ? scale3(key.cloud, 0.86) : key.cloud;
        put(cx + c, cl.y + r, cc, false);
      }
    }
  }

  function paintLand() {
    var x, y;
    for (x = 0; x < W; x++) {
      var fy = Math.round(hillY(x, true)), ny = Math.round(hillY(x, false));
      for (y = fy; y < 34; y++) put(x, y, C.hillFar, true);
      for (y = ny; y < 34; y++) put(x, y, C.hillNear, true);
    }
    for (x = 0; x < W; x++) {
      var top = 23 + (hash2(x >> 1, 3) % 3 === 0 ? -1 : 0);
      for (y = top; y < 34; y++) {

  }

  function paintSand() {

    }
  }

  function shadowOf(x, y, rx, ry) {

  }

  var lamps = [];

  function lightingPass(key) {

  function glowPass(key, ms) {

      var R = 20;
      for (var y = L.y - R; y <= L.y + R; y++) for (var x = L.x - R; x <= L.x + R; x++) {

        for (var wy = 0; wy < 2; wy++) for (var wx = -1; wx <= 1; wx++) put(L.x + wx, L.y + wy, fc, false);
      }
    }
  }

  function fireflyPass(key, ms) {
    if (reduceMotion || key.dark < 0.3) return;
    for (var i = 0; i < flies.length; i++) {
      var f = flies[i];
      var x = f.bx + Math.sin(ms * f.fx + f.ph) * f.ax;

      blendPx(x, y - 1, C.firefly, a * 0.3); blendPx(x, y + 1, C.firefly, a * 0.3);
    }
  }

  /* ---------- pointer, keyboard, tools ---------- */
  var tool = 'rake';
  var hover = { x: 0, y: 0, on: false };
  var kb = { x: 80, y: 66, down: false, on: false };
  var drawing = false;
  var last = null;
  var dir = { x: 1, y: 0 };
  var started = false;

  var HINTS = {
    rake: 'Drag across the sand to rake it.',
    stone: 'Tap the sand to place a stone. Rings of sand grow around it.',
    pine: 'Tap to plant a pine on a patch of moss.',
    lantern: 'Tap to set a stone lantern. It lights up at dusk.',
    erase: 'Drag over things to clear them and smooth the sand.'

  var hintEl = document.getElementById('hint');
  var toolButtons = document.querySelectorAll('[data-tool]');
  function setTool(name) {
    tool = name;
    for (var i = 0; i < toolButtons.length; i++) toolButtons[i].setAttribute('aria-pressed', toolButtons[i].getAttribute('data-tool') === name ? 'true' : 'false');
    hintEl.textContent = HINTS[name];
  }
  for (var tb = 0; tb < toolButtons.length; tb++) {
    toolButtons[tb].addEventListener('click', function (e) { setTool(e.currentTarget.getAttribute('data-tool')); });
  }

  function toGame(e) {
    var r = canvas.getBoundingClientRect();
    return { x: Math.floor((e.clientX - r.left) * W / r.width), y: Math.floor((e.clientY - r.top) * H / r.height) };
  }

  function rakeTo(p) {
    if (!last) { last = { x: p.x, y: p.y }; return; }
    var dx = p.x - last.x, dy = p.y - last.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < 0.9) return;
    var ux = dx / len, uy = dy / len;
    var sx = lerp(dir.x, ux, 0.4), sy = lerp(dir.y, uy, 0.4);
    var sl = Math.sqrt(sx * sx + sy * sy) || 1;

    for (var s = 0; s <= len; s += 0.5) stampRake(last.x + ux * s, last.y + uy * s, dir.x, dir.y);
    last = { x: p.x, y: p.y };
    sfx.rake(len);
    dirty();
  }

  function useTool(p, isStart) {

      else rakeTo(p);

    } else if (isStart) {
      var v = 0;

      addObject(tool, p.x, p.y, v);
      sfx.place(tool);
      dirty();
    }
  }

  canvas.addEventListener('pointerdown', function (e) {

  });

  canvas.addEventListener('pointercancel', endDraw);

  canvas.addEventListener('blur', function () { kb.on = false; kb.down = false; last = null; sfx.rakeStop(); });
  canvas.addEventListener('keydown', function (e) {
    var step = e.shiftKey ? 3 : 1;
    var mx = 0, my = 0;
    if (e.key === 'ArrowLeft') mx = -step;
    else if (e.key === 'ArrowRight') mx = step;
    else if (e.key === 'ArrowUp') my = -step;
    else if (e.key === 'ArrowDown') my = step;

      return;
    } else return;
    e.preventDefault();

    kb.y = clamp(kb.y + my, FY0, FY1);
    if (kb.down) useTool({ x: kb.x, y: kb.y }, false);
    else if (tool === 'erase') useTool({ x: kb.x, y: kb.y }, false);
  });

  /* extra buttons */
  var tinesBtn = document.getElementById('tines');
  tinesBtn.addEventListener('click', function () {
    tineCount = tineCount === 3 ? 5 : tineCount === 5 ? 7 : 3;
    tinesBtn.textContent = 'Tines: ' + tineCount;
  });
  var timeBtn = document.getElementById('time');
  timeBtn.addEventListener('click', function () {
    timeMode = (timeMode + 1) % TIME_MODES.length;
    timeBtn.textContent = 'Time: ' + TIME_MODES[timeMode][1];
  });
  document.getElementById('smooth').addEventListener('click', function () { sand.fill(0); dirty(); });
  var clearBtn = document.getElementById('clear');
  var clearTimer = 0;
  clearBtn.addEventListener('click', function () {

  });

  /* ---------- sound (off until asked) ---------- */
  var audio = { ctx: null, master: null, noise: null, filter: null, gain: null, on: false, timer: 0 };
  var sfx = {
    rake: function (speed) {

      audio.gain.gain.setTargetAtTime(Math.min(0.5, speed * 0.05), t, 0.03);

    },
    rakeStop: function () {

    },
    place: function (kind) {

      else if (kind === 'lantern') { tone(880, 0.9, 'sine', 0.16); tone(1318, 0.7, 'sine', 0.1); }

      for (var i = 0; i < n; i++) { lastv = (lastv + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = lastv * 3.5; }

      audio.filter = c.createBiquadFilter(); audio.filter.type = 'bandpass'; audio.filter.frequency.value = 900; audio.filter.Q.value = 0.7;
      audio.gain = c.createGain(); audio.gain.gain.value = 0;

  }
  var soundBtn = document.getElementById('sound');
  soundBtn.addEventListener('click', function () {
    if (!audio.on) {

      audio.on = true;

      soundBtn.setAttribute('aria-pressed', 'true');
      tone(659.25, 1.2, 'sine', 0.08);
      ambient();
    } else {
      audio.on = false;
      sfx.rakeStop();
      clearTimeout(audio.timer);
      soundBtn.textContent = 'Sound: off';
      soundBtn.setAttribute('aria-pressed', 'false');
    }
  });

  /* ---------- drawing the frame ---------- */
  function paintCursor(ms) {
    var white = [255, 252, 244];
    if (hover.on) {
      var p = hover;
      if (tool === 'rake') {
        var nx = -dir.y, ny = dir.x;
        for (var k = 0; k < tineCount; k++) {
          var off = (k - (tineCount - 1) / 2) * TINE_GAP;
          blendPx(p.x + nx * off, p.y + ny * off, white, 0.85);
        }
      } else if (tool === 'erase') {
        for (var a = 0; a < 16; a++) blendPx(p.x + Math.cos(a / 16 * 6.283) * 5, p.y + Math.sin(a / 16 * 6.283) * 5, white, 0.8);
      } else if (!drawing) {
        var spr = tool === 'stone' ? STONES[stoneCycle % STONES.length] : tool === 'pine' ? PINE : LANTERN;
        var tmp = { t: tool, v: stoneCycle % STONES.length, x: p.x, y: p.y };
        var hw = halfWidth(tmp);
        blit(spr, clamp(p.x, FX0 + hw + 1, FX1 - hw - 1), clamp(p.y, FY0 + 3, FY1 - 1), 0.5);
      }
    }
    if (kb.on) {
      var blink = Math.floor(ms / 400) % 2 === 0;
      var col = blink ? [255, 255, 255] : [183, 65, 14];
      put(kb.x, kb.y, col, false);
      put(kb.x - 2, kb.y, col, false); put(kb.x + 2, kb.y, col, false);
      put(kb.x, kb.y - 2, col, false); put(kb.x, kb.y + 2, col, false);
    }
  }

  function render(ms) {
    var t = currentT();
    var key = keyAt(t);
    paintSky(key, t, ms);
    paintLand();
    paintSand();
    paintObjects();
    lightingPass(key);
    glowPass(key, ms);
    fireflyPass(key, ms);
    paintCursor(ms);
    ctx.putImageData(image, 0, 0);
  }

  /* ---------- size on screen ---------- */
  function fit() {
    var holder = canvas.parentNode;
    var page = holder.parentNode;
    var availW = Math.min(960, page.clientWidth - 20 - 2 * Math.max(4, Math.min(10, window.innerWidth * 0.012)));
    var byW = availW >= 2 * W ? Math.floor(availW / W) : Math.max(1, availW / W);
    var scaleN = byW;
    if (byW >= 2) {

      scaleN = Math.min(byW, Math.max(2, byH));
    }
    canvas.style.width = Math.round(W * scaleN) + 'px';
    canvas.style.height = Math.round(H * scaleN) + 'px';
  }
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', fit);
  fit();

  /* ---------- go ---------- */
  if (!load()) starterGarden();
  var lastFrame = 0;
  var lastMs = 0;
  function frame(ms) {
