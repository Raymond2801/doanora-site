<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 300" role="img" aria-label="A flow from staff on Telegram to the policy bot to the AI model. The company documents feed the bot and are sent to the model with every question. Three places to check: 1, what is in the documents folder, only what every employee may read; 2, who can ask, an allowed list with leavers removed; 3, where the keys are, in secret settings with a spending cap." font-size="13">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Three places to check in a policy bot</text>
<rect x="24" y="52" width="200" height="70" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="124" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Staff</text>
<text x="124" y="102" text-anchor="middle" font-size="12" fill="#241208">ask on Telegram</text>
<rect x="280" y="52" width="200" height="70" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="380" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Policy bot</text>
<text x="380" y="102" text-anchor="middle" font-size="12" fill="#241208">runs on your hosting</text>
<rect x="536" y="52" width="200" height="70" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="636" y="84" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">AI model</text>
<text x="636" y="102" text-anchor="middle" font-size="12" fill="#241208">writes the answer</text>
<rect x="280" y="150" width="200" height="56" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="380" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Documents</text>
<text x="380" y="193" text-anchor="middle" font-size="12" fill="#241208">sent with every question</text>
<path d="M228 87L276 87" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M484 87L532 87" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M380 146L380 126" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<circle cx="252" cy="87" r="11" fill="#b7410e"/>
<text x="252" y="91.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<circle cx="508" cy="87" r="11" fill="#b7410e"/>
<text x="508" y="91.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<circle cx="398" cy="136" r="11" fill="#b7410e"/>
<text x="398" y="140.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<circle cx="35" cy="238" r="11" fill="#b7410e"/>
<text x="35" y="242.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<text x="54" y="242" font-size="12.5" font-weight="600" fill="#241208">What is in the folder?</text>
<text x="54" y="259" font-size="12" fill="#241208">Only what every employee</text>
<text x="54" y="275" font-size="12" fill="#241208">may read</text>
<circle cx="279" cy="238" r="11" fill="#b7410e"/>
<text x="279" y="242.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<text x="298" y="242" font-size="12.5" font-weight="600" fill="#241208">Who can ask?</text>
<text x="298" y="259" font-size="12" fill="#241208">Allowed list; remove</text>
<text x="298" y="275" font-size="12" fill="#241208">people who leave</text>
<circle cx="523" cy="238" r="11" fill="#b7410e"/>
<text x="523" y="242.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<text x="542" y="242" font-size="12.5" font-weight="600" fill="#241208">Where are the keys?</text>
<text x="542" y="259" font-size="12" fill="#241208">Secret settings and</text>
<text x="542" y="275" font-size="12" fill="#241208">a spending cap</text>
</svg>
