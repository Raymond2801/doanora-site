<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 306" role="img" aria-label="Tres preguntas para cualquier herramienta de IA con acceso. Antes: ¿Qué detiene una mala acción antes de que ocurra?. Después: ¿Qué la registra, en un lugar al que solo se añade?. Desde fuera: ¿Quién comprueba el resultado desde fuera de la herramienta?. ¿No puedes responder las tres? Dale menos acceso a la herramienta." font-size="13">
