<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 336" role="img" aria-label="Only the brain is swapped; the frame stays as it is" font-size="13">
<defs>
<marker id="swap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Only the brain is swapped; the frame stays as it is</text>
<g>
<rect x="24" y="56" width="420" height="220" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="40" y="80" font-weight="600" fill="#241208">The frame stays the same</text>
</g>
<g>
<rect x="40" y="100" width="186" height="72" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="133" y="124" text-anchor="middle" font-weight="600" fill="#241208">Memory</text>
<text x="133" y="140" text-anchor="middle" font-size="11.5" fill="#241208">notes and recent</text>
<text x="133" y="156" text-anchor="middle" font-size="11.5" fill="#241208">conversation</text>
</g>
<g>
<rect x="242" y="100" width="186" height="72" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="335" y="124" text-anchor="middle" font-weight="600" fill="#241208">Tools</text>
<text x="335" y="140" text-anchor="middle" font-size="11.5" fill="#241208">email, files,</text>
<text x="335" y="156" text-anchor="middle" font-size="11.5" fill="#241208">reminders</text>
</g>
<g>
<rect x="40" y="188" width="186" height="72" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="133" y="212" text-anchor="middle" font-weight="600" fill="#241208">Executor</text>
<text x="133" y="228" text-anchor="middle" font-size="11.5" fill="#241208">runs the tool the</text>
<text x="133" y="244" text-anchor="middle" font-size="11.5" fill="#241208">model asks for</text>
</g>
<g>
<rect x="242" y="188" width="186" height="72" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="335" y="212" text-anchor="middle" font-weight="600" fill="#241208">Approval flow</text>
<text x="335" y="228" text-anchor="middle" font-size="11.5" fill="#241208">human approval before</text>
<text x="335" y="244" text-anchor="middle" font-size="11.5" fill="#241208">irreversible actions</text>
</g>
<g>
<rect x="540" y="76" width="196" height="72" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="638" y="100" text-anchor="middle" font-weight="600" fill="#241208">Cloud model (today)</text>
<text x="638" y="116" text-anchor="middle" font-size="11.5" fill="#241208">Claude API</text>
<text x="638" y="132" text-anchor="middle" font-size="11.5" fill="#241208">hosted, nothing to run</text>
</g>
<g>
<rect x="540" y="184" width="196" height="72" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="638" y="208" text-anchor="middle" font-weight="600" fill="#241208">Local model (option)</text>
<text x="638" y="224" text-anchor="middle" font-size="11.5" fill="#241208">LM Studio, on my laptop</text>
<text x="638" y="240" text-anchor="middle" font-size="11.5" fill="#241208">OpenAI-style endpoint</text>
</g>
<g>
<path d="M444 112H540" fill="none" stroke="#857261" stroke-width="1.25" marker-end="url(#swap-arrow)"/>
<path d="M444 220H540" fill="none" stroke="#857261" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#swap-arrow)"/>
<path d="M638 148V184" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#swap-arrow)" marker-end="url(#swap-arrow)"/>
<text x="492" y="103" text-anchor="middle" font-size="11.5" fill="#6b5847">model call</text>
<text x="492" y="211" text-anchor="middle" font-size="11.5" fill="#6b5847">new address</text>
<text x="648" y="170" font-size="11.5" fill="#6b5847">swap brains</text>
</g>
<g>
<rect x="24" y="298" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="46" y="309" font-size="11.5" fill="#6b5847">System: the frame around the model</text>
<rect x="300" y="298" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="322" y="309" font-size="11.5" fill="#6b5847">Model: the brain</text>
</g>
</svg>
