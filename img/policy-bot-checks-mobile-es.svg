<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 580" role="img" aria-label="Un flujo del personal en Telegram al bot de políticas y al modelo de IA. Los documentos de la empresa alimentan al bot y se envían al modelo con cada pregunta. Tres puntos que revisar: 1, qué hay en la carpeta de documentos, solo lo que todo empleado puede leer; 2, quién puede preguntar, una lista permitida y dar de baja a quien se va; 3, dónde están las claves, en ajustes secretos y con un tope de gasto." font-size="13">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Tres puntos que revisar en un bot de políticas</text>
<rect x="24" y="52" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Personal</text>
<text x="114" y="99" text-anchor="middle" font-size="12" fill="#241208">pregunta por Telegram</text>
<rect x="24" y="164" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Bot de políticas</text>
<text x="114" y="211" text-anchor="middle" font-size="12" fill="#241208">se ejecuta en tu hosting</text>
<rect x="24" y="276" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Modelo de IA</text>
<text x="114" y="323" text-anchor="middle" font-size="12" fill="#241208">redacta la respuesta</text>
<rect x="228" y="164" width="112" height="64" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="284" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Documentos</text>
<text x="284" y="204" text-anchor="middle" font-size="11.5" fill="#241208">se envían con</text>
<text x="284" y="218" text-anchor="middle" font-size="11.5" fill="#241208">cada pregunta</text>
<path d="M114 120L114 160" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M114 232L114 272" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M224 196L208 196" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<circle cx="114" cy="140" r="11" fill="#b7410e"/>
<text x="114" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<circle cx="114" cy="252" r="11" fill="#b7410e"/>
<text x="114" y="256.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<circle cx="216" cy="180" r="11" fill="#b7410e"/>
<text x="216" y="184.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<circle cx="35" cy="380" r="11" fill="#b7410e"/>
<text x="35" y="384.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<text x="54" y="384" font-size="12.5" font-weight="600" fill="#241208">¿Qué hay en la carpeta?</text>
<text x="54" y="401" font-size="12" fill="#241208">Solo lo que todo empleado</text>
<text x="54" y="417" font-size="12" fill="#241208">puede leer</text>
<circle cx="35" cy="444" r="11" fill="#b7410e"/>
<text x="35" y="448.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<text x="54" y="448" font-size="12.5" font-weight="600" fill="#241208">¿Quién puede preguntar?</text>
<text x="54" y="465" font-size="12" fill="#241208">Lista permitida; da de baja</text>
<text x="54" y="481" font-size="12" fill="#241208">a quien se va</text>
<circle cx="35" cy="508" r="11" fill="#b7410e"/>
<text x="35" y="512.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<text x="54" y="512" font-size="12.5" font-weight="600" fill="#241208">¿Dónde están las claves?</text>
<text x="54" y="529" font-size="12" fill="#241208">Ajustes secretos y</text>
<text x="54" y="545" font-size="12" fill="#241208">un tope de gasto</text>
</svg>
