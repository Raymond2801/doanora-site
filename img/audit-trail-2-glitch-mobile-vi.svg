<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 432" role="img" aria-label="Một email đã đi sai như thế nào. Điều tôi muốn: Một tiêu đề, một nội dung và một tệp đính kèm, mỗi thứ một chỗ. Điều Winston đọc được: Một ký tự trong tiêu đề tách nó làm đôi, nên mọi trường lệch đi một chỗ. Điều đã gửi đi: Một email nội dung sai và không có tệp đính kèm." font-size="13">
<defs>
