<text x="596" y="164" font-size="11.5" fill="#241208">qua công cụ,</text>
<text x="596" y="180" font-size="11.5" fill="#241208">cần thử trước</text>
</g>
<g>
<text x="24" y="220" fill="#241208">Nhớ giữa các cuộc chat</text>
<g>
<circle cx="226" cy="216" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="220" font-size="11.5" fill="#241208">bắt đầu lại từ đầu</text>
<g>
<circle cx="402" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="220" font-size="11.5" fill="#241208">hệ thống lưu lại</text>
<g>
<circle cx="578" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="220" font-size="11.5" fill="#241208">hệ thống lưu lại</text>
</g>
<g>
<text x="24" y="268" fill="#241208">Có thông tin mới nhất</text>
<g>
<circle cx="226" cy="264" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="268" font-size="11.5" fill="#241208">kiến thức đóng băng</text>
<g>
<circle cx="402" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="268" font-size="11.5" fill="#241208">hệ thống lấy về</text>
<g>
<circle cx="578" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="268" font-size="11.5" fill="#241208">hệ thống lấy về</text>
</g>
<text x="24" y="316" font-size="11.5" font-weight="600" fill="#6b5847">Phụ thuộc vào nơi mô hình chạy</text>
<g>
