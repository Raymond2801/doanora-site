<circle cx="578" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="396" font-size="11.5" fill="#241208">có, dùng chung</text>
<text x="596" y="412" font-size="11.5" fill="#241208">laptop với Winston</text>
</g>
<g>
<rect x="24" y="448" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="46" y="459" font-size="11.5" fill="#6b5847">Một mô hình đứng riêng</text>
<rect x="240" y="448" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="262" y="459" font-size="11.5" fill="#6b5847">Một mô hình có hệ thống bao quanh</text>
</g>
