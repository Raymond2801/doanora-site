<g>
<circle cx="226" cy="352" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="356" font-size="11.5" fill="#241208">có</text>
<g>
<circle cx="402" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="356" font-size="11.5" fill="#241208">không</text>
<g>
<circle cx="578" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M578 345A7 7 0 0 1 578 359Z" fill="#241208"/>
</g>
<text x="596" y="348" font-size="11.5" fill="#241208">mô hình có,</text>
<text x="596" y="364" font-size="11.5" fill="#241208">Telegram không</text>
</g>
<g>
<text x="24" y="404" fill="#241208">Mô hình chạy trên máy tôi</text>
<g>
<circle cx="226" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="404" font-size="11.5" fill="#241208">có</text>
<g>
<circle cx="402" cy="400" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="404" font-size="11.5" fill="#241208">không, chạy từ xa</text>
