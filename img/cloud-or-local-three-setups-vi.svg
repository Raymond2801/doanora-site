<g>
<text x="24" y="172" fill="#241208">Hành động trong đời thực</text>
<g>
<circle cx="226" cy="168" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="172" font-size="11.5" fill="#241208">chỉ có văn bản</text>
