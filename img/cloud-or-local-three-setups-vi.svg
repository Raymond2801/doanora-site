<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="Hệ thống thêm bộ nhớ và hành động; nơi mô hình chạy quyết định phần còn lại" font-size="13">
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Hệ thống thêm bộ nhớ và hành động; nơi mô hình chạy quyết định phần còn lại</text>
<g>
<rect x="208" y="56" width="168" height="52" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="292" y="78" text-anchor="middle" font-weight="600" fill="#241208">Chat cục bộ</text>
<text x="292" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(chế độ cơ bản)</text>
</g>
<g>
<rect x="384" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="468" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston hiện tại</text>
<text x="468" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(bộ não đám mây)</text>
</g>
<g>
<rect x="560" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="644" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston với</text>
<text x="644" y="94" text-anchor="middle" font-size="11.5" fill="#241208">bộ não cục bộ</text>
</g>
<text x="24" y="134" font-size="11.5" font-weight="600" fill="#6b5847">Phần hệ thống bổ sung</text>
