<g>
<circle cx="31" cy="483" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="46" y="487" font-size="11.5" fill="#6b5847">có</text>
<g>
<circle cx="120" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M120 476A7 7 0 0 1 120 490Z" fill="#241208"/>
</g>
<text x="135" y="487" font-size="11.5" fill="#6b5847">một phần, hoặc còn phải thử</text>
<g>
<circle cx="320" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="335" y="487" font-size="11.5" fill="#6b5847">không</text>
</g>
