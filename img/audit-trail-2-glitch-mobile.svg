<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 432" role="img" aria-label="How one email went out wrong. What I meant: A subject, a message and an attachment, each in its own place. What Winston read: A character in the subject split it in two, so every field moved one place. What went out: An email with the wrong content and no attachment." font-size="13">
