<g transform="translate(40,219.0)" fill="none" stroke="#b7410e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="8" width="14" height="8" rx="2"/><rect x="24" y="8" width="14" height="8" rx="2"/><rect x="12" y="19" width="32" height="8" rx="2"/><rect x="12" y="30" width="32" height="8" rx="2" stroke-dasharray="3 3"/></g>
<text x="100" y="216" text-anchor="start" font-size="13" font-weight="600" fill="#241208">What Winston read</text>
