<rect x="240" y="448" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="262" y="459" font-size="11.5" fill="#6b5847">Un modelo con un sistema alrededor</text>
</g>
<g>
<g>
<circle cx="31" cy="483" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="46" y="487" font-size="11.5" fill="#6b5847">sí</text>
<g>
<circle cx="120" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M120 476A7 7 0 0 1 120 490Z" fill="#241208"/>
</g>
<text x="135" y="487" font-size="11.5" fill="#6b5847">en parte, o por probar</text>
<g>
<circle cx="300" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="315" y="487" font-size="11.5" fill="#6b5847">no</text>
