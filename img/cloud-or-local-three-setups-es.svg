<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="El sistema añade memoria y acción; dónde se ejecuta el modelo decide el resto" font-size="13">
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">El sistema añade memoria y acción; dónde se ejecuta el modelo decide el resto</text>
<g>
<rect x="208" y="56" width="168" height="52" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="292" y="78" text-anchor="middle" font-weight="600" fill="#241208">Chat local</text>
<text x="292" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(modo básico)</text>
</g>
<g>
<rect x="384" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="468" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston hoy</text>
<text x="468" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(cerebro en la nube)</text>
</g>
<g>
<rect x="560" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="644" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston con</text>
<text x="644" y="94" text-anchor="middle" font-size="11.5" fill="#241208">un cerebro local</text>
</g>
<text x="24" y="134" font-size="11.5" font-weight="600" fill="#6b5847">Lo que añade el sistema</text>
<g>
<line x1="24" y1="192" x2="728" y2="192" stroke="#d3c6b5"/>
<line x1="24" y1="240" x2="728" y2="240" stroke="#d3c6b5"/>
<line x1="24" y1="376" x2="728" y2="376" stroke="#d3c6b5"/>
</g>
<g>
<text x="24" y="172" fill="#241208">Actúa en el mundo real</text>
<g>
<circle cx="226" cy="168" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="172" font-size="11.5" fill="#241208">solo texto</text>
<g>
<circle cx="402" cy="168" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="172" font-size="11.5" fill="#241208">con herramientas</text>
<g>
<circle cx="578" cy="168" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M578 161A7 7 0 0 1 578 175Z" fill="#241208"/>
</g>
<text x="596" y="164" font-size="11.5" fill="#241208">con herramientas,</text>
<text x="596" y="180" font-size="11.5" fill="#241208">probar antes</text>
</g>
<g>
<text x="24" y="220" fill="#241208">Recuerda entre chats</text>
<g>
<circle cx="226" cy="216" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="220" font-size="11.5" fill="#241208">empieza de cero</text>
<g>
<circle cx="402" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="220" font-size="11.5" fill="#241208">lo guarda el sistema</text>
<g>
<circle cx="578" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="220" font-size="11.5" fill="#241208">lo guarda el sistema</text>
</g>
<g>
<text x="24" y="268" fill="#241208">Tiene información actual</text>
<g>
<circle cx="226" cy="264" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="268" font-size="11.5" fill="#241208">entrenamiento congelado</text>
<g>
<circle cx="402" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="268" font-size="11.5" fill="#241208">el sistema la obtiene</text>
<g>
<circle cx="578" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="268" font-size="11.5" fill="#241208">el sistema la obtiene</text>
</g>
<text x="24" y="316" font-size="11.5" font-weight="600" fill="#6b5847">Lo que depende de dónde se ejecuta el modelo</text>
<g>
<text x="24" y="356" fill="#241208">Funciona sin internet</text>
<g>
<circle cx="226" cy="352" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="356" font-size="11.5" fill="#241208">sí</text>
<g>
<circle cx="402" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="356" font-size="11.5" fill="#241208">no</text>
<g>
<circle cx="578" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M578 345A7 7 0 0 1 578 359Z" fill="#241208"/>
</g>
<text x="596" y="348" font-size="11.5" fill="#241208">el modelo sí,</text>
<text x="596" y="364" font-size="11.5" fill="#241208">Telegram no</text>
</g>
<g>
<text x="24" y="404" fill="#241208">Modelo en mi hardware</text>
<g>
<circle cx="226" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="404" font-size="11.5" fill="#241208">sí</text>
<g>
<circle cx="402" cy="400" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="404" font-size="11.5" fill="#241208">no, está alojado</text>
<g>
<circle cx="578" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="396" font-size="11.5" fill="#241208">sí, comparte la</text>
<text x="596" y="412" font-size="11.5" fill="#241208">laptop con Winston</text>
</g>
<g>
<rect x="24" y="448" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
