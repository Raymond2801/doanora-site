<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 540" role="img" aria-label="Un chat local es solo un modelo; un asistente es un modelo más un sistema" font-size="13">
<defs>
<marker id="hub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Un chat local es solo un modelo; un asistente es un modelo más un sistema</text>
<text x="24" y="70" font-weight="600" fill="#241208">Modelo local en una ventana de chat (como el chat de LM Studio)</text>
<g>
<rect x="24" y="92" width="112" height="56" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="80" y="116" text-anchor="middle" font-weight="600" fill="#241208">Tú</text>
<text x="80" y="132" text-anchor="middle" font-size="11.5" fill="#6b5847">(ventana de chat)</text>
</g>
<g>
<path d="M136 120H264" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="200" y="111" text-anchor="middle" font-size="11.5" fill="#6b5847">mensaje, respuesta</text>
</g>
<g>
<rect x="264" y="84" width="200" height="72" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="364" y="108" text-anchor="middle" font-weight="600" fill="#241208">Modelo local</text>
<text x="364" y="124" text-anchor="middle" font-size="11.5" fill="#241208">solo conocimiento congelado</text>
<text x="364" y="140" text-anchor="middle" font-size="11.5" fill="#241208">sin memoria ni herramientas</text>
</g>
<g>
<line x1="24" y1="176" x2="736" y2="176" stroke="#d3c6b5"/>
</g>
<text x="24" y="204" font-weight="600" fill="#241208">Asistente integrado (como Winston)</text>
<g>
<rect x="264" y="220" width="200" height="56" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="364" y="244" text-anchor="middle" font-weight="600" fill="#241208">Memoria</text>
<text x="364" y="260" text-anchor="middle" font-size="11.5" fill="#6b5847">notas y chat reciente</text>
</g>
<g>
<rect x="264" y="312" width="200" height="72" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="364" y="336" text-anchor="middle" font-weight="600" fill="#241208">El sistema</text>
<text x="364" y="352" text-anchor="middle" font-size="11.5" fill="#241208">añade memoria y herramientas</text>
<text x="364" y="368" text-anchor="middle" font-size="11.5" fill="#241208">ejecuta herramientas, responde</text>
</g>
<g>
<rect x="264" y="420" width="200" height="56" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="364" y="444" text-anchor="middle" font-weight="600" fill="#241208">Herramientas</text>
<text x="364" y="460" text-anchor="middle" font-size="11.5" fill="#6b5847">correo, archivos, recordatorios</text>
</g>
<g>
<rect x="24" y="320" width="112" height="56" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="80" y="344" text-anchor="middle" font-weight="600" fill="#241208">Tú</text>
<text x="80" y="360" text-anchor="middle" font-size="11.5" fill="#6b5847">(Telegram)</text>
</g>
<g>
<rect x="588" y="312" width="148" height="72" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="662" y="336" text-anchor="middle" font-weight="600" fill="#241208">Modelo en la nube</text>
<text x="662" y="352" text-anchor="middle" font-size="11.5" fill="#241208">solo escribe texto,</text>
<text x="662" y="368" text-anchor="middle" font-size="11.5" fill="#241208">nunca ejecuta nada</text>
</g>
<g>
<path d="M136 348H264" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<path d="M464 348H588" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<path d="M364 276V312" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<path d="M364 384V420" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="200" y="339" text-anchor="middle" font-size="11.5" fill="#6b5847">mensaje, respuesta</text>
<text x="526" y="339" text-anchor="middle" font-size="11.5" fill="#6b5847">consulta, respuesta</text>
<text x="374" y="298" font-size="11.5" fill="#6b5847">añade memoria</text>
<text x="374" y="406" font-size="11.5" fill="#6b5847">ejecuta la herramienta</text>
</g>
<g>
<rect x="24" y="498" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="46" y="509" font-size="11.5" fill="#6b5847">Sistema: la estructura que rodea al modelo</text>
<rect x="320" y="498" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="342" y="509" font-size="11.5" fill="#6b5847">Modelo: el cerebro, que solo escribe texto</text>
</g>
</svg>
