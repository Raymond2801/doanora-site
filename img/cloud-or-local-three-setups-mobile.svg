<text x="66" y="602" text-anchor="middle" font-size="11.5" fill="#241208">yes</text>
</g>
<g>
<g>
<circle cx="180" cy="580" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="180" y="602" text-anchor="middle" font-size="11.5" fill="#241208">no, it is</text>
<text x="180" y="616" text-anchor="middle" font-size="11.5" fill="#241208">hosted</text>
</g>
<g>
<g>
<circle cx="294" cy="580" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="294" y="602" text-anchor="middle" font-size="11.5" fill="#241208">yes, shares</text>
<text x="294" y="616" text-anchor="middle" font-size="11.5" fill="#241208">the laptop with</text>
<text x="294" y="630" text-anchor="middle" font-size="11.5" fill="#241208">Winston</text>
</g>
</g>
<g>
<rect x="12" y="672" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
