<g>
<text x="12" y="252" fill="#241208">Remembers between chats</text>
<g>
<g>
<circle cx="66" cy="276" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="66" y="298" text-anchor="middle" font-size="11.5" fill="#241208">starts fresh</text>
</g>
<g>
<g>
<circle cx="180" cy="276" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="180" y="298" text-anchor="middle" font-size="11.5" fill="#241208">system</text>
<text x="180" y="312" text-anchor="middle" font-size="11.5" fill="#241208">stores it</text>
</g>
<g>
<g>
<circle cx="294" cy="276" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="294" y="298" text-anchor="middle" font-size="11.5" fill="#241208">system</text>
<text x="294" y="312" text-anchor="middle" font-size="11.5" fill="#241208">stores it</text>
</g>
</g>
<line x1="12" y1="326" x2="348" y2="326" stroke="#d3c6b5"/>
<g>
<text x="12" y="342" fill="#241208">Has current information</text>
<g>
<g>
<circle cx="66" cy="366" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="66" y="388" text-anchor="middle" font-size="11.5" fill="#241208">frozen training</text>
</g>
<g>
<g>
<circle cx="180" cy="366" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="180" y="388" text-anchor="middle" font-size="11.5" fill="#241208">system</text>
<text x="180" y="402" text-anchor="middle" font-size="11.5" fill="#241208">fetches it</text>
</g>
<g>
<g>
<circle cx="294" cy="366" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="294" y="388" text-anchor="middle" font-size="11.5" fill="#241208">system</text>
<text x="294" y="402" text-anchor="middle" font-size="11.5" fill="#241208">fetches it</text>
</g>
</g>
<text x="12" y="438" font-size="11.5" font-weight="600" fill="#6b5847">What depends on where the model runs</text>
<g>
<text x="12" y="466" fill="#241208">Works without internet</text>
<g>
<g>
<circle cx="66" cy="490" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="66" y="512" text-anchor="middle" font-size="11.5" fill="#241208">yes</text>
</g>
<g>
<g>
<circle cx="180" cy="490" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="180" y="512" text-anchor="middle" font-size="11.5" fill="#241208">no</text>
</g>
<g>
<g>
<circle cx="294" cy="490" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M294 483A7 7 0 0 1 294 497Z" fill="#241208"/>
</g>
<text x="294" y="512" text-anchor="middle" font-size="11.5" fill="#241208">model yes,</text>
<text x="294" y="526" text-anchor="middle" font-size="11.5" fill="#241208">Telegram no</text>
</g>
</g>
<line x1="12" y1="540" x2="348" y2="540" stroke="#d3c6b5"/>
<g>
<text x="12" y="556" fill="#241208">Model on my hardware</text>
