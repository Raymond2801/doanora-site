</g>
<g>
<g>
<circle cx="19" cy="730" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="32" y="734" font-size="11.5" fill="#6b5847">yes</text>
<g>
<circle cx="78" cy="730" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
