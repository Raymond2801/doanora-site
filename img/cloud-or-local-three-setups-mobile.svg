<text x="294" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#241208">Winston with</text>
<text x="294" y="100" text-anchor="middle" font-size="11.5" fill="#241208">a local brain</text>
</g>
<text x="12" y="138" font-size="11.5" font-weight="600" fill="#6b5847">What the system adds</text>
<g>
<text x="12" y="162" fill="#241208">Acts on the world</text>
<g>
<g>
<circle cx="66" cy="186" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="66" y="208" text-anchor="middle" font-size="11.5" fill="#241208">text only</text>
</g>
<g>
<g>
<circle cx="180" cy="186" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="180" y="208" text-anchor="middle" font-size="11.5" fill="#241208">through tools</text>
</g>
<g>
<g>
<circle cx="294" cy="186" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M294 179A7 7 0 0 1 294 193Z" fill="#241208"/>
</g>
<text x="294" y="208" text-anchor="middle" font-size="11.5" fill="#241208">through tools,</text>
