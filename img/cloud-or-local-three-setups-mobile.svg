<text x="66" y="84" text-anchor="middle" font-size="12.5" font-weight="600" fill="#241208">Local chat</text>
<text x="66" y="100" text-anchor="middle" font-size="11.5" fill="#241208">(basic mode)</text>
</g>
<g>
