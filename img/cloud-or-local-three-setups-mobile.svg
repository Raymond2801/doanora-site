<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 752" role="img" aria-label="The system adds memory and action; where the model runs sets the rest" font-size="13">
<text x="16" y="28" font-size="14" font-weight="600" fill="#241208">The system adds memory and action;</text>
<text x="16" y="47" font-size="14" font-weight="600" fill="#241208">where the model runs sets the rest</text>
<g>
