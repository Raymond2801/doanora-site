<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 760 512" role="img" aria-label="The system adds memory and action; where the model runs sets the rest" font-size="13">
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">The system adds memory and action; where the model runs sets the rest</text>
<g>
<rect x="208" y="56" width="168" height="52" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="292" y="78" text-anchor="middle" font-weight="600" fill="#241208">Local chat</text>
<text x="292" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(basic mode)</text>
</g>
<g>
<rect x="384" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="468" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston today</text>
<text x="468" y="94" text-anchor="middle" font-size="11.5" fill="#241208">(cloud brain)</text>
</g>
<g>
<rect x="560" y="56" width="168" height="52" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="644" y="78" text-anchor="middle" font-weight="600" fill="#241208">Winston with</text>
<text x="644" y="94" text-anchor="middle" font-size="11.5" fill="#241208">a local brain</text>
</g>
<text x="24" y="134" font-size="11.5" font-weight="600" fill="#6b5847">What the system adds</text>
<g>
<line x1="24" y1="192" x2="728" y2="192" stroke="#d3c6b5"/>
<line x1="24" y1="240" x2="728" y2="240" stroke="#d3c6b5"/>
<line x1="24" y1="376" x2="728" y2="376" stroke="#d3c6b5"/>
</g>
<g>
<text x="24" y="172" fill="#241208">Acts on the world</text>
<g>
<circle cx="226" cy="168" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="172" font-size="11.5" fill="#241208">text only</text>
<g>
<circle cx="402" cy="168" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="172" font-size="11.5" fill="#241208">through tools</text>
<g>
<circle cx="578" cy="168" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M578 161A7 7 0 0 1 578 175Z" fill="#241208"/>
</g>
<text x="596" y="164" font-size="11.5" fill="#241208">through tools,</text>
<text x="596" y="180" font-size="11.5" fill="#241208">test it first</text>
</g>
<g>
<text x="24" y="220" fill="#241208">Remembers between chats</text>
<g>
<circle cx="226" cy="216" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="220" font-size="11.5" fill="#241208">starts fresh</text>
<g>
<circle cx="402" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="220" font-size="11.5" fill="#241208">system stores it</text>
<g>
<circle cx="578" cy="216" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="220" font-size="11.5" fill="#241208">system stores it</text>
</g>
<g>
<text x="24" y="268" fill="#241208">Has current information</text>
<g>
<circle cx="226" cy="264" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="268" font-size="11.5" fill="#241208">frozen training</text>
<g>
<circle cx="402" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="268" font-size="11.5" fill="#241208">system fetches it</text>
<g>
<circle cx="578" cy="264" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="268" font-size="11.5" fill="#241208">system fetches it</text>
</g>
<text x="24" y="316" font-size="11.5" font-weight="600" fill="#6b5847">What depends on where the model runs</text>
<g>
<text x="24" y="356" fill="#241208">Works without internet</text>
<g>
<circle cx="226" cy="352" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="356" font-size="11.5" fill="#241208">yes</text>
<g>
<circle cx="402" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="356" font-size="11.5" fill="#241208">no</text>
<g>
<circle cx="578" cy="352" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M578 345A7 7 0 0 1 578 359Z" fill="#241208"/>
</g>
<text x="596" y="348" font-size="11.5" fill="#241208">model yes,</text>
<text x="596" y="364" font-size="11.5" fill="#241208">Telegram no</text>
</g>
<g>
<text x="24" y="404" fill="#241208">Model on my hardware</text>
<g>
<circle cx="226" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="244" y="404" font-size="11.5" fill="#241208">yes</text>
<g>
<circle cx="402" cy="400" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="420" y="404" font-size="11.5" fill="#241208">no, it is hosted</text>
<g>
<circle cx="578" cy="400" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="596" y="396" font-size="11.5" fill="#241208">yes, shares the</text>
<text x="596" y="412" font-size="11.5" fill="#241208">laptop with Winston</text>
</g>
<g>
<rect x="24" y="448" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="46" y="459" font-size="11.5" fill="#6b5847">A model on its own</text>
<rect x="240" y="448" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="262" y="459" font-size="11.5" fill="#6b5847">A model with a system around it</text>
</g>
<g>
<g>
<circle cx="31" cy="483" r="7" fill="#241208" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="46" y="487" font-size="11.5" fill="#6b5847">yes</text>
<g>
<circle cx="120" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
<path d="M120 476A7 7 0 0 1 120 490Z" fill="#241208"/>
</g>
<text x="135" y="487" font-size="11.5" fill="#6b5847">partly, or still to test</text>
<g>
<circle cx="300" cy="483" r="7" fill="none" stroke="#241208" stroke-width="1.5"/>
</g>
<text x="315" y="487" font-size="11.5" fill="#6b5847">no</text>
</g>
</svg>
