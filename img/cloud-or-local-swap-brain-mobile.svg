<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 548" role="img" aria-label="Only the brain is swapped; the frame stays as it is" font-size="13">
<defs>
<marker id="swap-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="16" y="28" font-size="14" font-weight="600" fill="#241208">Only the brain is swapped;</text>
<text x="16" y="47" font-size="14" font-weight="600" fill="#241208">the frame stays as it is</text>
<g>
<rect x="12" y="64" width="336" height="226" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="28" y="88" font-weight="600" fill="#241208">The frame stays the same</text>
</g>
<g>
<rect x="28" y="104" width="148" height="80" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="102" y="126" text-anchor="middle" font-weight="600" fill="#241208">Memory</text>
<text x="102" y="142" text-anchor="middle" font-size="11.5" fill="#241208">notes and recent</text>
<text x="102" y="158" text-anchor="middle" font-size="11.5" fill="#241208">conversation</text>
</g>
<g>
<rect x="184" y="104" width="148" height="80" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="258" y="126" text-anchor="middle" font-weight="600" fill="#241208">Tools</text>
<text x="258" y="142" text-anchor="middle" font-size="11.5" fill="#241208">email, files,</text>
<text x="258" y="158" text-anchor="middle" font-size="11.5" fill="#241208">reminders</text>
</g>
<g>
<rect x="28" y="194" width="148" height="80" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="102" y="216" text-anchor="middle" font-weight="600" fill="#241208">Executor</text>
<text x="102" y="232" text-anchor="middle" font-size="11.5" fill="#241208">runs the tool the</text>
<text x="102" y="248" text-anchor="middle" font-size="11.5" fill="#241208">model asks for</text>
</g>
<g>
<rect x="184" y="194" width="148" height="80" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="258" y="216" text-anchor="middle" font-weight="600" fill="#241208">Approval flow</text>
<text x="258" y="232" text-anchor="middle" font-size="11.5" fill="#241208">human approval</text>
<text x="258" y="248" text-anchor="middle" font-size="11.5" fill="#241208">before irreversible</text>
<text x="258" y="264" text-anchor="middle" font-size="11.5" fill="#241208">actions</text>
</g>
<path d="M90 290V350" fill="none" stroke="#857261" stroke-width="1.25" marker-end="url(#swap-arrow)"/>
<path d="M270 290V350" fill="none" stroke="#857261" stroke-width="1.25" stroke-dasharray="4 4" marker-end="url(#swap-arrow)"/>
<text x="98" y="324" font-size="11.5" fill="#6b5847">model call</text>
<text x="262" y="324" text-anchor="end" font-size="11.5" fill="#6b5847">new address</text>
<g>
<rect x="12" y="350" width="156" height="96" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="90" y="374" text-anchor="middle" font-weight="600" fill="#241208">Cloud model</text>
<text x="90" y="390" text-anchor="middle" font-weight="600" fill="#241208">(today)</text>
<text x="90" y="410" text-anchor="middle" font-size="11.5" fill="#241208">Claude API</text>
<text x="90" y="426" text-anchor="middle" font-size="11.5" fill="#241208">hosted, nothing to run</text>
</g>
<g>
<rect x="192" y="350" width="156" height="96" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="270" y="374" text-anchor="middle" font-weight="600" fill="#241208">Local model</text>
<text x="270" y="390" text-anchor="middle" font-weight="600" fill="#241208">(option)</text>
<text x="270" y="410" text-anchor="middle" font-size="11.5" fill="#241208">LM Studio, on my laptop</text>
<text x="270" y="426" text-anchor="middle" font-size="11.5" fill="#241208">OpenAI-style endpoint</text>
</g>
<path d="M90 446V472H270V446" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#swap-arrow)" marker-end="url(#swap-arrow)"/>
<text x="180" y="464" text-anchor="middle" font-size="11.5" fill="#6b5847">swap brains</text>
<g>
<rect x="16" y="500" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="38" y="511" font-size="11.5" fill="#6b5847">System: the frame around the model</text>
<rect x="16" y="522" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="38" y="533" font-size="11.5" fill="#6b5847">Model: the brain</text>
</g>
</svg>
