<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 580" role="img" aria-label="A flow from staff on Telegram to the policy bot to the AI model. The company documents feed the bot and are sent to the model with every question. Three places to check: 1, what is in the documents folder, only what every employee may read; 2, who can ask, an allowed list with leavers removed; 3, where the keys are, in secret settings with a spending cap." font-size="13">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="24" y="34" font-size="15" font-weight="600" fill="#241208">Three places to check in a policy bot</text>
<rect x="24" y="52" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="81" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Staff</text>
<text x="114" y="99" text-anchor="middle" font-size="12" fill="#241208">ask on Telegram</text>
<rect x="24" y="164" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="193" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Policy bot</text>
<text x="114" y="211" text-anchor="middle" font-size="12" fill="#241208">runs on your hosting</text>
<rect x="24" y="276" width="180" height="64" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="114" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">AI model</text>
<text x="114" y="323" text-anchor="middle" font-size="12" fill="#241208">writes the answer</text>
<rect x="228" y="164" width="112" height="64" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="284" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#241208">Documents</text>
<text x="284" y="204" text-anchor="middle" font-size="11.5" fill="#241208">sent with</text>
<text x="284" y="218" text-anchor="middle" font-size="11.5" fill="#241208">every question</text>
<path d="M114 120L114 160" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M114 232L114 272" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<path d="M224 196L208 196" stroke="#857261" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
<circle cx="114" cy="140" r="11" fill="#b7410e"/>
<text x="114" y="144.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<circle cx="114" cy="252" r="11" fill="#b7410e"/>
<text x="114" y="256.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<circle cx="216" cy="180" r="11" fill="#b7410e"/>
<text x="216" y="184.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<circle cx="35" cy="380" r="11" fill="#b7410e"/>
<text x="35" y="384.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">1</text>
<text x="54" y="384" font-size="12.5" font-weight="600" fill="#241208">What is in the folder?</text>
<text x="54" y="401" font-size="12" fill="#241208">Only what every employee</text>
<text x="54" y="417" font-size="12" fill="#241208">may read</text>
<circle cx="35" cy="444" r="11" fill="#b7410e"/>
<text x="35" y="448.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">2</text>
<text x="54" y="448" font-size="12.5" font-weight="600" fill="#241208">Who can ask?</text>
<text x="54" y="465" font-size="12" fill="#241208">Allowed list; remove</text>
<text x="54" y="481" font-size="12" fill="#241208">people who leave</text>
<circle cx="35" cy="508" r="11" fill="#b7410e"/>
<text x="35" y="512.5" text-anchor="middle" font-size="13" font-weight="700" fill="#fffaf6">3</text>
<text x="54" y="512" font-size="12.5" font-weight="600" fill="#241208">Where are the keys?</text>
<text x="54" y="529" font-size="12" fill="#241208">Secret settings and</text>
<text x="54" y="545" font-size="12" fill="#241208">a spending cap</text>
</svg>
