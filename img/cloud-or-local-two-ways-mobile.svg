<svg xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" viewBox="0 0 360 712" role="img" aria-label="A local chat is just a model; an assistant is a model plus a system" font-size="13">
<defs>
<marker id="hub-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0L10 5L0 10z" fill="#857261"/>
</marker>
</defs>
<text x="16" y="28" font-size="14" font-weight="600" fill="#241208">A local chat is just a model;</text>
<text x="16" y="47" font-size="14" font-weight="600" fill="#241208">an assistant is a model plus a system</text>
<text x="16" y="84" font-weight="600" fill="#241208">Local model in a chat window</text>
<text x="16" y="101" font-weight="600" fill="#241208">(like the LM Studio chat)</text>
<g>
<rect x="100" y="114" width="160" height="52" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="180" y="136" text-anchor="middle" font-weight="600" fill="#241208">You</text>
<text x="180" y="152" text-anchor="middle" font-size="11.5" fill="#6b5847">(chat window)</text>
</g>
<g>
<path d="M180 166V206" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="190" y="190" font-size="11.5" fill="#6b5847">message, answer</text>
</g>
<g>
<rect x="80" y="206" width="200" height="72" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="180" y="230" text-anchor="middle" font-weight="600" fill="#241208">Local model</text>
<text x="180" y="246" text-anchor="middle" font-size="11.5" fill="#241208">frozen training only</text>
<text x="180" y="262" text-anchor="middle" font-size="11.5" fill="#241208">no memory, no tools</text>
</g>
<line x1="16" y1="300" x2="344" y2="300" stroke="#d3c6b5"/>
<text x="16" y="326" font-weight="600" fill="#241208">Integrated assistant (like Winston)</text>
<g>
<rect x="100" y="342" width="160" height="52" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="180" y="364" text-anchor="middle" font-weight="600" fill="#241208">You</text>
<text x="180" y="380" text-anchor="middle" font-size="11.5" fill="#6b5847">(Telegram)</text>
</g>
<g>
<path d="M180 394V432" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="190" y="417" font-size="11.5" fill="#6b5847">message, reply</text>
</g>
<g>
<rect x="12" y="432" width="336" height="72" rx="8" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="180" y="456" text-anchor="middle" font-weight="600" fill="#241208">The system</text>
<text x="180" y="472" text-anchor="middle" font-size="11.5" fill="#241208">adds memory and tools</text>
<text x="180" y="488" text-anchor="middle" font-size="11.5" fill="#241208">runs tools, sends reply</text>
</g>
<g>
<path d="M64 504V552" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="72" y="525" font-size="11.5" fill="#6b5847">adds</text>
<text x="72" y="539" font-size="11.5" fill="#6b5847">memory</text>
</g>
<g>
<path d="M180 504V552" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="188" y="525" font-size="11.5" fill="#6b5847">asks,</text>
<text x="188" y="539" font-size="11.5" fill="#6b5847">gets answer</text>
</g>
<g>
<path d="M296 504V552" fill="none" stroke="#857261" stroke-width="1.25" marker-start="url(#hub-arrow)" marker-end="url(#hub-arrow)"/>
<text x="304" y="525" font-size="11.5" fill="#6b5847">runs the</text>
<text x="304" y="539" font-size="11.5" fill="#6b5847">tool</text>
</g>
<g>
<rect x="12" y="552" width="104" height="84" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="64" y="574" text-anchor="middle" font-weight="600" fill="#241208">Memory</text>
<text x="64" y="590" text-anchor="middle" font-size="11.5" fill="#6b5847">notes and</text>
<text x="64" y="606" text-anchor="middle" font-size="11.5" fill="#6b5847">recent chat</text>
</g>
<g>
<rect x="128" y="552" width="104" height="84" rx="8" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="180" y="574" text-anchor="middle" font-weight="600" fill="#241208">Cloud model</text>
<text x="180" y="590" text-anchor="middle" font-size="11.5" fill="#241208">writes text</text>
<text x="180" y="606" text-anchor="middle" font-size="11.5" fill="#241208">only, never</text>
<text x="180" y="622" text-anchor="middle" font-size="11.5" fill="#241208">runs anything</text>
</g>
<g>
<rect x="244" y="552" width="104" height="84" rx="8" fill="none" stroke="#857261" stroke-width="1.25"/>
<text x="296" y="574" text-anchor="middle" font-weight="600" fill="#241208">Tools</text>
<text x="296" y="590" text-anchor="middle" font-size="11.5" fill="#6b5847">email, files,</text>
<text x="296" y="606" text-anchor="middle" font-size="11.5" fill="#6b5847">reminders</text>
</g>
<g>
<rect x="16" y="664" width="14" height="14" rx="3" fill="#28616c" fill-opacity="0.12" stroke="#28616c" stroke-width="2"/>
<text x="38" y="675" font-size="11.5" fill="#6b5847">System: the frame around the model</text>
<rect x="16" y="686" width="14" height="14" rx="3" fill="#b7410e" fill-opacity="0.12" stroke="#b7410e" stroke-width="2"/>
<text x="38" y="697" font-size="11.5" fill="#6b5847">Model: the brain, which only writes text</text>
</g>
</svg>
